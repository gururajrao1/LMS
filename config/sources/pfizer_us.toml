schema_version = 1
jurisdiction = "US"
reviewed_on = "2026-07-14"

[policy]
scope = "A fixed, course-specific evidence set for Pfizer portfolio training."
source_priority = ["current_fda_label", "fda_review_or_safety", "trial_registry", "peer_reviewed_publication", "us_guideline"]
conflict_rule = "The current FDA-approved label controls approved use, dosing, contraindications, warnings, and adverse reactions."
label_rule = "Select the NDA holder or manufacturer label; exclude repackager labels."
literature_rule = "Use named pivotal or required safety studies only; do not run an unbounded literature search."
guideline_rule = "Use one current US professional-society guideline for the course indication."
faers_rule = "FAERS may identify a signal to review, but must not support incidence, comparison, or causality claims."
completion_rule = "Every generated factual claim must cite one registered source or be marked unsupported."

[services.dailymed]
documentation = "https://dailymed.nlm.nih.gov/dailymed/app-support-web-services.cfm"
retrieval = "API v2 plus the selected Set ID's XML, PDF, and version history"

[services.drugs_at_fda]
documentation = "https://www.fda.gov/drugs/drug-approvals-and-databases/drugsfda-data-files"
retrieval = "Official application record and linked FDA review documents"

[services.openfda]
documentation = "https://open.fda.gov/apis/drug/drugsfda/"
retrieval = "Structured Drugs@FDA record by exact NDA application number"

[services.clinical_trials]
documentation = "https://clinicaltrials.gov/data-api/about-api"
retrieval = "API v2 by exact NCT ID"

[services.pubmed]
documentation = "https://www.ncbi.nlm.nih.gov/books/NBK25500/"
retrieval = "NCBI E-utilities by exact PMID"

