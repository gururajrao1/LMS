<div class="space-y-xs">

</div>
</div>

<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface block" for="password">Password</label>
<a class="font-label-sm text-label-sm text-secondary hover:text-on-secondary-container transition-colors" href="#">Forgot Password?</a>
</div>

<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant" style="font-size: 20px;">lock</span>

</div>
